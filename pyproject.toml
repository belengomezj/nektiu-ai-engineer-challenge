[project]
name = "nektiu-ai-engineer-challenge"
version = "0.1.0"
description = "A small, grounded RAG assistant for the Nektiu AI Engineer challenge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["api*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

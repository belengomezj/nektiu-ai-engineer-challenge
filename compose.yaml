services:
  api:
    build:
      context: .
      target: api
    env_file:
      - api/.env
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 3s
      retries: 5
    init: true

  frontend:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    init: true
